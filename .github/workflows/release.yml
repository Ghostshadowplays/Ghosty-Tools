name: Build and Release EXE

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag to build and publish (leave blank for build artifacts only)"
        required: false
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: "Existing release tag to build and publish"
        required: true
        type: string
    secrets:
      CERT_PFX:
        required: true
      CERT_PASSWORD:
        required: true

permissions:
  contents: write

concurrency:
  group: release-build-${{ inputs.tag_name || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Resolve release version and commit
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name && format('refs/tags/{0}', inputs.tag_name) || github.event.release.tag_name && format('refs/tags/{0}', github.event.release.tag_name) || github.sha }}

      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version=$(jq -er '.version' config/version.json)
          if ! [[ "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid version in config/version.json: $version"
            exit 1
          fi
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "$version" ]; then
            echo "::error::Tag $RELEASE_TAG does not match config/version.json ($version)."
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag_name=$RELEASE_TAG"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows EXE
    needs: metadata
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pyinstaller
          python -m pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller ghosty_tools.spec --clean --noconfirm
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          Move-Item dist/GhostyTools.exe dist/GhostyTools-Windows-x64.exe

      - name: Prepare signing certificate without prompts
        shell: pwsh
        timeout-minutes: 3
        env:
          CERT_PFX: ${{ secrets.CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfxPath = Join-Path $env:RUNNER_TEMP "ghostshadow.pfx"
          Write-Host "Decoding the signing PFX."
          [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:CERT_PFX))
          Write-Host "Loading the signing certificate with an ephemeral private key."
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $pfxPath,
            $env:CERT_PASSWORD,
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          )
          try {
            if (-not $cert.HasPrivateKey) { throw "The PFX does not contain a private key" }

            if ($cert.Subject -eq $cert.Issuer) {
              $publicPath = Join-Path $env:RUNNER_TEMP "ghostshadow.cer"
              Export-Certificate -Cert $cert -FilePath $publicPath | Out-Null
              # CurrentUser\Root can show a hidden trust prompt. The hosted runner
              # is elevated, so force a public-cert import into LocalMachine\Root.
              Write-Host "Trusting the public certificate in the runner's machine root store."
              & certutil.exe -f -addstore Root $publicPath
              if ($LASTEXITCODE -ne 0) { throw "Certificate trust installation failed (exit $LASTEXITCODE)" }
              Write-Host "Public certificate trust installed."
            }

            "SIGNER_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
            Write-Host "Signing certificate preparation complete."
          } finally {
            $cert.Dispose()
          }

      - name: Locate SignTool
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          "SIGNTOOL_PATH=$signtool" >> $env:GITHUB_ENV

      - name: Sign EXE
        shell: pwsh
        timeout-minutes: 5
        env:
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          & $env:SIGNTOOL_PATH sign `
            /f "$env:RUNNER_TEMP\ghostshadow.pfx" `
            /p $env:CERT_PASSWORD `
            /sha1 $env:SIGNER_THUMBPRINT `
            /fd SHA256 `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            dist\GhostyTools-Windows-x64.exe
          if ($LASTEXITCODE -ne 0) { throw "SignTool signing failed" }

      - name: Verify signature and timestamp
        shell: pwsh
        timeout-minutes: 3
        run: |
          $sig = Get-AuthenticodeSignature dist\GhostyTools-Windows-x64.exe
          $sig | Format-List
          if ($sig.Status -ne "Valid") { throw "Code signing validation failed: $($sig.StatusMessage)" }
          if ($sig.SignerCertificate.Thumbprint -ne $env:SIGNER_THUMBPRINT) { throw "Unexpected signing certificate" }
          if (-not $sig.TimeStamperCertificate) { throw "The signature is missing its timestamp" }

      - name: Remove signing files
        if: always()
        shell: pwsh
        run: |
          foreach ($name in @("ghostshadow.pfx", "ghostshadow.cer")) {
            $path = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
          }

      - name: Generate SHA256
        shell: pwsh
        run: |
          $hash = Get-FileHash dist\GhostyTools-Windows-x64.exe -Algorithm SHA256
          "$($hash.Hash)  GhostyTools-Windows-x64.exe" |
            Out-File dist\GhostyTools-Windows-x64.exe.sha256 -Encoding ascii

      - name: Save Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghosty-release-windows
          path: |
            dist/GhostyTools-Windows-x64.exe
            dist/GhostyTools-Windows-x64.exe.sha256
          if-no-files-found: error
          overwrite: true

  build-macos:
    name: Build macOS (arm64)
    needs: metadata
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pyinstaller
          python -m pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller ghosty_tools.spec --clean --noconfirm
          mv dist/GhostyTools dist/GhostyTools-macOS-arm64
          cd dist
          shasum -a 256 GhostyTools-macOS-arm64 > GhostyTools-macOS-arm64.sha256

      - name: Save macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghosty-release-macos
          path: |
            dist/GhostyTools-macOS-arm64
            dist/GhostyTools-macOS-arm64.sha256
          if-no-files-found: error
          overwrite: true

  build-linux:
    name: Build Linux DEB Package
    needs: metadata
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xclip xsel dpkg-dev
          python -m pip install --upgrade pip
          python -m pip install --upgrade pyinstaller
          python -m pip install -r requirements.txt

      - name: Build Linux Binary
        run: |
          pyinstaller ghosty_tools.spec --clean --noconfirm
          mv dist/GhostyTools dist/GhostyTools-Linux-x64

      - name: Create DEB structure
        run: |
          mkdir -p ghostytools_amd64/DEBIAN ghostytools_amd64/usr/bin
          cp dist/GhostyTools-Linux-x64 ghostytools_amd64/usr/bin/ghostytools
          chmod +x ghostytools_amd64/usr/bin/ghostytools
          VERSION_NUMBER="${VERSION#v}"
          dpkg --validate-version "$VERSION_NUMBER"

          cat <<EOF > ghostytools_amd64/DEBIAN/control
          Package: ghostytools
          Version: ${VERSION_NUMBER}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Ghostshadow <ghosty@ghostyware.com>
          Description: Professional All-in-One Cross-Platform Optimization & Security Suite
           Ghosty Tools is a high-performance, modular utility designed to secure and optimize Linux environments.
          EOF

      - name: Build DEB package
        run: |
          dpkg-deb --build ghostytools_amd64
          mv ghostytools_amd64.deb GhostyTools-Linux-x64.deb
          sha256sum GhostyTools-Linux-x64.deb > GhostyTools-Linux-x64.deb.sha256

      - name: Save Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghosty-release-linux
          path: |
            GhostyTools-Linux-x64.deb
            GhostyTools-Linux-x64.deb.sha256
          if-no-files-found: error
          overwrite: true

  sbom:
    name: Generate SBOM
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: ghostytools-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM SHA256
        run: sha256sum ghostytools-sbom.spdx.json > ghostytools-sbom.spdx.json.sha256

      - name: Save SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghosty-release-sbom
          path: |
            ghostytools-sbom.spdx.json
            ghostytools-sbom.spdx.json.sha256
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish complete release
    needs: [metadata, build-windows, build-macos, build-linux, sbom]
    if: needs.metadata.outputs.tag_name != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ghosty-release-*
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub release with all assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.metadata.outputs.tag_name }}
          target_commitish: ${{ needs.metadata.outputs.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/GhostyTools-Windows-x64.exe
            release-assets/GhostyTools-Windows-x64.exe.sha256
            release-assets/GhostyTools-macOS-arm64
            release-assets/GhostyTools-macOS-arm64.sha256
            release-assets/GhostyTools-Linux-x64.deb
            release-assets/GhostyTools-Linux-x64.deb.sha256
            release-assets/ghostytools-sbom.spdx.json
            release-assets/ghostytools-sbom.spdx.json.sha256
