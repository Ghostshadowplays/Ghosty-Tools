name: Build and Release EXE

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller ghosty_tools.spec --clean --noconfirm
          mv dist/GhostyTools.exe dist/GhostyTools-Windows-x64.exe

      - name: Recreate PFX
        shell: powershell
        run: |
          [System.IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\ghostshadow.pfx",
            [System.Convert]::FromBase64String("${{ secrets.CERT_PFX }}")
          )

      - name: Locate SignTool
        shell: powershell
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits" -Recurse -Filter signtool.exe |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $signtool) {
            throw "signtool.exe not found"
          }

          Write-Host "Found SignTool: $signtool"
          echo "SIGNTOOL_PATH=$signtool" >> $env:GITHUB_ENV

      - name: Sign EXE
        shell: powershell
        run: |
          & "$env:SIGNTOOL_PATH" sign `
            /f "$env:RUNNER_TEMP\ghostshadow.pfx" `
            /p "${{ secrets.CERT_PASSWORD }}" `
            /fd SHA256 `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            dist\GhostyTools-Windows-x64.exe

      - name: Verify Signature
        shell: powershell
        run: |
          $sig = Get-AuthenticodeSignature dist\GhostyTools-Windows-x64.exe

          $sig | Format-List

          if ($sig.Status -ne "Valid") {
            throw "Code signing validation failed"
          }

          Write-Host "Signature valid"

      - name: Generate SHA256
        shell: powershell
        run: |
          $hash = Get-FileHash dist\GhostyTools-Windows-x64.exe -Algorithm SHA256
          "$($hash.Hash)  GhostyTools-Windows-x64.exe" |
            Out-File dist\GhostyTools-Windows-x64.exe.sha256 -Encoding ascii

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        if: github.event_name == 'release'
        with:
          files: |
            dist/GhostyTools-Windows-x64.exe
            dist/GhostyTools-Windows-x64.exe.sha256
          tag_name: ${{ github.event.release.tag_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            python-arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller ghosty_tools.spec --clean --noconfirm
          mv dist/GhostyTools dist/GhostyTools-macOS-${{ matrix.arch }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        if: github.event_name == 'release'
        with:
          files: dist/GhostyTools-macOS-${{ matrix.arch }}
          tag_name: ${{ github.event.release.tag_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux DEB Package
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ github.event.release.tag_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xclip xsel dpkg-dev
          python -m pip install --upgrade pip
          pip install --upgrade pyinstaller
          pip install -r requirements.txt

      - name: Build Linux Binary
        run: |
          pyinstaller ghosty_tools.spec --clean --noconfirm
          mv dist/GhostyTools dist/GhostyTools-Linux-x64

      - name: Create DEB structure
        run: |
          mkdir -p ghostytools_amd64/DEBIAN
          mkdir -p ghostytools_amd64/usr/bin

          cp dist/GhostyTools-Linux-x64 ghostytools_amd64/usr/bin/ghostytools
          chmod +x ghostytools_amd64/usr/bin/ghostytools

          VERSION_NUMBER=$(echo "$VERSION" | sed 's/^v//')

          cat <<EOF > ghostytools_amd64/DEBIAN/control
          Package: ghostytools
          Version: ${VERSION_NUMBER}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Ghostshadow <ghosty@ghostyware.com>
          Description: Professional All-in-One Cross-Platform Optimization & Security Suite
           Ghosty Tools is a high-performance, modular utility designed to secure and optimize Linux environments.
          EOF

      - name: Build DEB package
        run: |
          dpkg-deb --build ghostytools_amd64
          mv ghostytools_amd64.deb GhostyTools-Linux-x64.deb

      - name: Generate Linux SHA256
        run: |
          sha256sum GhostyTools-Linux-x64.deb > GhostyTools-Linux-x64.deb.sha256

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        if: github.event_name == 'release'
        with:
          files: |
            GhostyTools-Linux-x64.deb
            GhostyTools-Linux-x64.deb.sha256
          tag_name: ${{ github.event.release.tag_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
