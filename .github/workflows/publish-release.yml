
name: Publish Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Configure Git identity
        shell: bash
        env:
          GIT_EMAIL: ${{ secrets.RELEASE_GIT_EMAIL }}
        run: |
          set -euo pipefail

          if [ -z "${GIT_EMAIL:-}" ]; then
            echo "::error::RELEASE_GIT_EMAIL secret is missing or empty."
            exit 1
          fi

          git config --local user.name "Ghostshadowplays"
          git config --local user.email "$GIT_EMAIL"

          echo "Git identity configured:"
          git config --local user.name
          git config --local user.email

      - name: Get release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(jq -r '.version' config/version.json)

          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preparing release $VERSION"

      - name: Check existing tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin --tags

          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Release tag $VERSION already exists."
            exit 1
          fi

      - name: Create release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          git tag -a "$VERSION" -m "Ghosty Tools $VERSION"
          git push origin "$VERSION"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: main
          generate_release_notes: true
          fail_on_unmatched_files: false
          token: ${{ secrets.GH_PAT }}
