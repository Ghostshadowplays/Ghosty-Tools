name: Publish Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Tag merged release commit
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout merged release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Configure Git identity
        shell: bash
        env:
          GIT_EMAIL: ${{ secrets.RELEASE_GIT_EMAIL }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -z "${GIT_EMAIL:-}" ]; then
            echo "::error::RELEASE_GIT_EMAIL secret is missing or empty."
            exit 1
          fi
          git config --local user.name "$REPOSITORY_OWNER"
          git config --local user.email "$GIT_EMAIL"

      - name: Get and validate release version
        id: version
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          VERSION=$(jq -er '.version' config/version.json)
          if ! [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi
          if [ "$RELEASE_BRANCH" != "release/$VERSION" ]; then
            echo "::error::Release branch $RELEASE_BRANCH does not match $VERSION."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release tag or reuse it on a retry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            if [ "$(git rev-parse "$VERSION^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Tag $VERSION already points to a different commit."
              exit 1
            fi
            echo "Reusing tag $VERSION for this release commit."
          else
            git tag -a "$VERSION" -m "Ghosty Tools $VERSION"
            git push origin "refs/tags/$VERSION"
          fi

  build-and-publish:
    name: Build and publish release assets
    needs: prepare
    # Call directly: events created with GITHUB_TOKEN do not start other workflows.
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.prepare.outputs.version }}
    secrets: inherit
