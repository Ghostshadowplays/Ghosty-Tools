name: Security & Quality Audit

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    name: Audit (Bandit + Gitleaks + Trivy + pip-audit) • py${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Quick compile check
        run: |
          python - <<'PY'
          import pathlib
          import py_compile

          for p in pathlib.Path(".").rglob("*.py"):
              if ".venv" in p.parts or p.parts[0] == ".github":
                  continue
              py_compile.compile(str(p), doraise=True)

          print("py_compile OK")
          PY

      - name: Bandit (fail on High severity)
        run: |
          set -e

          bandit -q -r . \
            -x .venv,.github \
            -lll \
            -o bandit-report.txt \
            --format txt || true

          if grep -E "Severity:\s*HIGH" bandit-report.txt >/dev/null 2>&1; then
            echo "High severity Bandit findings detected" >&2
            cat bandit-report.txt
            exit 1
          fi

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report-py${{ matrix.python-version }}
          path: bandit-report.txt

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

      - name: Dependency Audit (pip-audit)
        run: |
          pip-audit -r requirements.txt --progress-spinner off

  windows-smoke:
    name: Windows smoke (install + compile) • py3.14
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import smoke
        shell: bash
        run: |
          python - <<'PY'
          import importlib

          for mod in (
              "PyQt6",
              "psutil",
              "cryptography",
              "speedtest"
          ):
              importlib.import_module(mod)

          print("Imports OK")
          PY

      - name: Compile check
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import py_compile

          for p in pathlib.Path(".").rglob("*.py"):
              if ".venv" in p.parts or p.parts[0] == ".github":
                  continue
              py_compile.compile(str(p), doraise=True)

          print("py_compile OK (Windows)")
          PY
