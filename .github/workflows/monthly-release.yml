
name: Monthly Auto Release

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: monthly-auto-release
  cancel-in-progress: false

jobs:
  monthly-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Fetch latest changes and tags
        run: |
          git fetch origin main --tags
          git checkout -B main origin/main

      - name: Get latest release tag
        id: tag
        shell: bash
        run: |
          # Ignore historical non-semver tags and avoid head/SIGPIPE under pipefail.
          latest=$(git tag --list | { grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || true; } | sort -V | tail -n 1)

          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi

          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Latest release: $latest"

      - name: Check for changes since last release
        id: changes
        shell: bash
        env:
          LATEST: ${{ steps.tag.outputs.latest }}
        run: |
          if [ "$LATEST" = "v0.0.0" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          count=$(git rev-list "$LATEST"..origin/main --count)

          echo "Commits since last release: $count"

          if [ "$count" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for required workflows to pass
        if: steps.changes.outputs.changed == 'true'
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          bash .github/scripts/wait-for-release-checks.sh

      - name: Calculate version bump
        if: steps.changes.outputs.changed == 'true'
        id: version
        shell: bash
        env:
          LATEST: ${{ steps.tag.outputs.latest }}
        run: |
          set -euo pipefail
          configured=$(jq -er '.version' config/version.json)
          if ! [[ "$configured" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid configured version: $configured"
            exit 1
          fi

          # A previous release may have bumped the files but failed before tagging.
          # Always advance beyond both the configured version and the latest tag.
          base=$(printf '%s\n' "$LATEST" "$configured" | sort -V | tail -n 1)
          version="${base#v}"

          IFS='.' read -r major minor patch <<< "$version"

          if ! [[ "$major" =~ ^[0-9]+$ &&
                  "$minor" =~ ^[0-9]+$ &&
                  "$patch" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid release version: $LATEST"
            exit 1
          fi

          patch=$((patch + 1))

          new_version="v${major}.${minor}.${patch}"

          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "Next version: $new_version"

      - name: Check for existing release PR
        if: steps.changes.outputs.changed == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          branch="release/$VERSION"

          number=$(gh pr list \
            --base main \
            --head "$branch" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$number" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "An open release PR already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version files
        if: steps.changes.outputs.changed == 'true' && steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          jq --arg version "$VERSION" '.version = $version' config/version.json > "$RUNNER_TEMP/version.json"
          mv "$RUNNER_TEMP/version.json" config/version.json

          sed -i "s/^CURRENT_VERSION = \"v[^\"]*\"/CURRENT_VERSION = \"$VERSION\"/" src/core/update_manager.py

          sed -i "s/^VERSION = \"v[^\"]*\"/VERSION = \"$VERSION\"/" main.py
          grep -Fxq "CURRENT_VERSION = \"$VERSION\"" src/core/update_manager.py
          grep -Fxq "VERSION = \"$VERSION\"" main.py

      - name: Configure SSH commit signing
        if: steps.changes.outputs.changed == 'true' && steps.existing.outputs.exists == 'false'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.RELEASE_SSH_PRIVATE_KEY }}
          GIT_EMAIL: ${{ secrets.RELEASE_GIT_EMAIL }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/ghostyware_signing"
          chmod 600 "$HOME/.ssh/ghostyware_signing"

          # Derive the public key from the private key.
          ssh-keygen -y -f "$HOME/.ssh/ghostyware_signing" > "$HOME/.ssh/ghostyware_signing.pub"

          # Configure Git to sign commits using SSH.
          git config user.name "$REPOSITORY_OWNER"
          git config user.email "$GIT_EMAIL"
          git config gpg.format ssh
          git config user.signingkey "$HOME/.ssh/ghostyware_signing"
          git config commit.gpgsign true
          git config gpg.ssh.allowedSignersFile "$HOME/.ssh/allowed_signers"

          # Configure local verification of the SSH signature.
          printf '%s namespaces="git" %s\n' \
            "$GIT_EMAIL" \
            "$(cat "$HOME/.ssh/ghostyware_signing.pub")" \
            > "$HOME/.ssh/allowed_signers"

      - name: Create signed release commit
        if: steps.changes.outputs.changed == 'true' && steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.new_version }}
        shell: bash
        run: |
          set -euo pipefail

          git add config/version.json
          git add src/core/update_manager.py
          git add main.py

          if git diff --cached --quiet; then
            echo "::error::No version changes detected."
            exit 1
          fi

          git commit -S -m "chore: bump version to $VERSION"

          git verify-commit HEAD

      - name: Push release branch
        if: steps.changes.outputs.changed == 'true' && steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          git push origin HEAD:"release/$VERSION"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true' && steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          body_file=$(mktemp)
          cat > "$body_file" <<EOF
          ## Ghosty Tools Monthly Release

          Automated monthly version bump to $VERSION.

          - Updates the bundled version and application version constants.
          - The version commit is SSH signed.
          - Security, CI, CodeQL, workflow validation and package builds passed for the source commit.
          - Auto-merge waits for the required PR checks and branch rules.
          - After merging, all release assets are built before publishing.
          EOF

          gh pr create \
            --base main \
            --head "release/$VERSION" \
            --title "Release $VERSION" \
            --body-file "$body_file"

      - name: Enable auto-merge after required checks
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          VERSION: ${{ steps.version.outputs.new_version }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "release/$VERSION" --auto --squash
