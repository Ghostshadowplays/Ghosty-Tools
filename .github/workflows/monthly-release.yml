name: Monthly Auto Release

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  monthly-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Ensure default branch is up to date
        run: |
          git fetch --tags origin

      - name: Get latest tag
        id: tag
        run: |
          latest=$(git tag --sort=-v:refname | head -n1)

          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi

          echo "latest=$latest" >> $GITHUB_OUTPUT

      - name: Check for changes since last release
        id: changes
        run: |
          latest=${{ steps.tag.outputs.latest }}

          if [ "$latest" = "v0.0.0" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          count=$(git rev-list $latest..HEAD --count)

          echo "Commits since last release: $count"

          if [ "$count" -gt 0 ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify required workflows passed
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list \
            --workflow="Security & Quality Audit" \
            --limit=1 \
            --json conclusion \
            --jq '.[0].conclusion' > security.txt

          gh run list \
            --workflow="Ghosty Tools CI" \
            --limit=1 \
            --json conclusion \
            --jq '.[0].conclusion' > ci.txt

          gh run list \
            --workflow="CodeQL" \
            --limit=1 \
            --json conclusion \
            --jq '.[0].conclusion' > codeql.txt

          SECURITY=$(cat security.txt)
          CI=$(cat ci.txt)
          CODEQL=$(cat codeql.txt)

          echo "Security: $SECURITY"
          echo "CI: $CI"
          echo "CodeQL: $CODEQL"

          [ "$SECURITY" = "success" ] || exit 1
          [ "$CI" = "success" ] || exit 1
          [ "$CODEQL" = "success" ] || exit 1

      - name: Calculate version bump
        if: steps.changes.outputs.changed == 'true'
        id: version
        run: |
          version=${{ steps.tag.outputs.latest }}
          version=${version#v}

          IFS='.' read -r major minor patch <<< "$version"

          patch=$((patch + 1))

          new_version="v${major}.${minor}.${patch}"

          echo "new_version=$new_version" >> $GITHUB_OUTPUT

      - name: Update version files
        if: steps.changes.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"

          sed -i "s/\"version\": \"v[^\"]*\"/\"version\": \"$VERSION\"/" config/version.json

          sed -i "s/CURRENT_VERSION = \"v[^\"]*\"/CURRENT_VERSION = \"$VERSION\"/" src/core/update_manager.py

          sed -i "s/VERSION = \"v[^\"]*\"/VERSION = \"$VERSION\"/" main.py

      - name: Commit version bump
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add config/version.json
          git add src/core/update_manager.py
          git add main.py

          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }}" || echo "No changes to commit"

          git push

      - name: Create tag
        if: steps.changes.outputs.changed == 'true'
        run: |
          git tag ${{ steps.version.outputs.new_version }}
          git push origin ${{ steps.version.outputs.new_version }}

      - name: Create GitHub Release
        if: steps.changes.outputs.changed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
